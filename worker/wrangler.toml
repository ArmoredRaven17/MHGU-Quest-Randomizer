name = "mhgu-bot-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# KV namespace for per-Twitch-channel saved filter profiles, keyed by the streamer's
# OAuth-verified Twitch login. Created via `wrangler kv namespace create MHGU_BOT_PROFILES`
# — fill in the id below with the value that command prints before deploying.
[[kv_namespaces]]
binding = "MHGU_BOT_PROFILES"
id = "e63eaa0c9e224ec9bc66fcdc919b74d3"

# Shared MHGU Bingo cards, keyed by a 6-char code the Worker mints. Separate from the
# profiles namespace above: different lifecycle (every entry is written with a 30-day
# expirationTtl) and no login involved. Create with
# `wrangler kv namespace create MHGU_BINGO_CARDS` and paste the printed id below.
[[kv_namespaces]]
binding = "MHGU_BINGO_CARDS"
id = "e25a7336e4b84ef7b830f1f89d4b9aae"

# One Durable Object per live MHGU Talisman Bingo session, holding just the current draw
# number. It is the first stateful primitive in this Worker, and it is a DO rather than a
# third KV namespace for one decisive reason: KV has no compare-and-swap, so the guarantee
# that the draw number never goes BACKWARDS would be unenforceable. See src/live-do.js.
[[durable_objects.bindings]]
name = "LIVE_SESSIONS"
class_name = "LiveSession"

# SQLite backend, not the KV backend: new_classes is rejected on the Workers free plan,
# new_sqlite_classes is not. Adding a class is easy; REMOVING one later needs a follow-up
# deleted_classes migration, so treat this tag as close to one-way.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveSession"]

# The settings page (settings.html/.js/.css) — served directly by the platform; requests
# that don't match a file here fall through to this Worker's fetch handler as usual.
[assets]
directory = "./public"

# Public — safe to commit. TWITCH_CLIENT_SECRET and SESSION_SECRET are set via
# `wrangler secret put` instead (see worker/.dev.vars for local dev).
[vars]
TWITCH_CLIENT_ID = "c9tk4geolyjvuozvgu6crr5of9prd6"
